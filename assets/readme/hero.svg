<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">CodexQuotaBar local quota and usage cockpit</title>
  <desc id="desc">A native macOS menu bar utility that reads the current seven-day Codex quota and local token metadata, then presents a compact Codex Meter panel.</desc>

  <rect width="1200" height="360" rx="28" fill="#0B1220"/>
  <path d="M64 284H1136" stroke="#25344B" stroke-width="2"/>
  <path d="M64 72H500" stroke="#4CC9F0" stroke-width="4" stroke-linecap="round"/>

  <g id="title-block" transform="translate(64 48)">
    <text x="0" y="0" fill="#8FA6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="2">MACOS MENU BAR UTILITY</text>
    <text x="0" y="68" fill="#F4F8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700">CodexQuotaBar</text>
    <text x="0" y="112" fill="#C7D5E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Local 7-day quota and local Token usage.</text>
    <text x="0" y="146" fill="#C7D5E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Official API rates, clearly labeled as an estimate.</text>
    <text x="0" y="188" fill="#8FA6C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">Swift + AppKit  ·  Python helpers  ·  local-first</text>
    <g transform="translate(0 220)">
      <rect width="234" height="38" rx="19" fill="#123047" stroke="#2D6E8C"/>
      <circle cx="22" cy="19" r="6" fill="#4ADEB0"/>
      <text x="40" y="25" fill="#DDFBF2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">READ-ONLY SOURCES</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(678 38)">
    <rect x="0" y="0" width="458" height="244" rx="22" fill="#111C2D" stroke="#2B405D" stroke-width="2"/>
    <text x="28" y="36" fill="#8FA6C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">LOCAL SNAPSHOT → CODEX METER</text>

    <g transform="translate(28 58)">
      <rect width="402" height="54" rx="14" fill="#17263A"/>
      <text x="20" y="35" fill="#C7D5E6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">7d</text>
      <g transform="translate(70 16)">
        <rect x="0" y="0" width="38" height="22" rx="7" fill="#4ADEB0"/>
        <rect x="46" y="0" width="38" height="22" rx="7" fill="#4ADEB0"/>
        <rect x="92" y="0" width="38" height="22" rx="7" fill="#4ADEB0"/>
        <rect x="138" y="0" width="38" height="22" rx="7" fill="#4ADEB0"/>
        <rect x="184" y="0" width="38" height="22" rx="7" fill="#33506B"/>
      </g>
      <text x="326" y="36" fill="#F4F8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">local</text>
    </g>

    <g transform="translate(28 134)">
      <rect width="112" height="72" rx="14" fill="#17263A" stroke="#2D6E8C"/>
      <circle cx="22" cy="24" r="6" fill="#4CC9F0"/>
      <text x="38" y="30" fill="#C7D5E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">metadata</text>
      <text x="18" y="57" fill="#8FA6C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">read-only</text>
    </g>
    <path d="M151 170H177" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round"/>
    <path d="M172 163L181 170L172 177" fill="none" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(190 134)">
      <rect width="112" height="72" rx="14" fill="#17263A" stroke="#2D6E8C"/>
      <circle cx="22" cy="24" r="6" fill="#4CC9F0"/>
      <text x="38" y="30" fill="#C7D5E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">delta index</text>
      <text x="18" y="57" fill="#8FA6C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">normalized</text>
    </g>
    <path d="M313 170H339" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round"/>
    <path d="M334 163L343 170L334 177" fill="none" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(352 134)">
      <rect width="78" height="72" rx="14" fill="#173B42" stroke="#327E86"/>
      <circle cx="22" cy="24" r="6" fill="#4ADEB0"/>
      <text x="38" y="30" fill="#DDFBF2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">panel</text>
      <text x="18" y="57" fill="#A7DDD2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">native</text>
    </g>
  </g>

  <g transform="translate(678 309)">
    <text x="0" y="0" fill="#8FA6C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">7-DAY QUOTA  /  TOKEN DELTAS  /  OFFICIAL PRICE CACHE</text>
  </g>
</svg>
